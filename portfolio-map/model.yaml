# ---------------------------------------------------------------------------
# Single source of truth for the one-page portfolio overview.
#
# Edit THIS file only. `python render.py` regenerates the PowerPoint slide, the
# draw.io drawing, the SVG and the CSV from it — all from the same layout, so
# they never drift apart.
#
# The overview is a grid: propositions are the rows, divisions are the columns,
# and each cell holds the contributions that division makes to that
# proposition. Colour of a contribution = the role it plays.
#
# Cells marked `assumed: true` are my inference, not something you stated —
# confirm or delete them.
# ---------------------------------------------------------------------------

meta:
  title: Portfolio overview — who does what
  subtitle: Rows are propositions · columns are divisions · colour is the role
  version: "0.2"
  updated: "2026-09-19"

divisions:
  - id: CD
    name: Cloud & Development
    short: C&D
    color: "#0B7285"
    expertise: [Software Engineering, Cloud Engineering, Platform Engineering, Workplace Management]
  - id: DAE
    name: Data, AI & Engagement
    short: DA&E
    color: "#5F3DC4"
    expertise: [Data Management, Data Platform, AI, Automation]
  - id: STT
    name: Security & Technology Transformation
    short: S&TT
    color: "#A61E4D"
    expertise: [Transformation, Adoption, Security]

# Six roles is the practical maximum for a readable page. `code` is the letter
# used in the CSV companion.
roles:
  - {id: build,   code: B, label: Builds & delivers, color: "#1C7ED6"}
  - {id: use,     code: U, label: Uses,              color: "#0CA678"}
  - {id: operate, code: O, label: Operates & runs,   color: "#495057"}
  - {id: govern,  code: G, label: Governs,           color: "#E8590C"}
  - {id: adopt,   code: A, label: Drives adoption,   color: "#7048E8"}

propositions:
  - id: platform-engineering
    name: Platform Engineering
  - id: ai-sdlc
    name: AI SDLC
  - id: observability
    name: Observability
  - id: cloud-landingzone
    name: Cloud Landingzone

# proposition + division + expertise + role + what. One line per contribution;
# this is the only list that grows as the picture gets richer.
contributions:
  # --- Platform Engineering ------------------------------------------------
  - {proposition: platform-engineering, division: CD,  expertise: Platform Engineering,
     role: build,   what: "Builds and runs the developer platform"}
  - {proposition: platform-engineering, division: CD,  expertise: Software Engineering,
     role: use,     what: "Builds and maintains applications on it"}
  - {proposition: platform-engineering, division: DAE, expertise: Automation,
     role: build,   what: "Automation building blocks", assumed: true}
  - {proposition: platform-engineering, division: STT, expertise: Adoption,
     role: adopt,   what: "Onboarding of teams onto the platform", assumed: true}

  # --- AI SDLC (the one you described in full) -----------------------------
  - {proposition: ai-sdlc, division: CD,  expertise: Cloud Engineering,
     role: build,   what: "Delivers the cloud platform the AI SDLC runs on"}
  - {proposition: ai-sdlc, division: CD,  expertise: Platform Engineering,
     role: build,   what: "Pipelines, tooling and golden paths"}
  - {proposition: ai-sdlc, division: CD,  expertise: Software Engineering,
     role: use,     what: "Uses the AI SDLC and platform to build and maintain applications"}
  - {proposition: ai-sdlc, division: DAE, expertise: AI,
     role: build,   what: "Engineers who build agents, guardrails, MCP integration and flows"}
  - {proposition: ai-sdlc, division: STT, expertise: Adoption,
     role: adopt,   what: "Drives adoption and enablement across teams"}
  - {proposition: ai-sdlc, division: STT, expertise: Security,
     role: govern,  what: "Security requirements behind the guardrails", assumed: true}

  # --- Observability -------------------------------------------------------
  - {proposition: observability, division: CD,  expertise: Platform Engineering,
     role: build,   what: "Telemetry pipeline and tooling", assumed: true}
  - {proposition: observability, division: CD,  expertise: Software Engineering,
     role: use,     what: "Instruments applications", assumed: true}
  - {proposition: observability, division: DAE, expertise: Data Platform,
     role: build,   what: "Stores and analyses the telemetry", assumed: true}
  - {proposition: observability, division: STT, expertise: Security,
     role: use,     what: "Consumes signals for security monitoring", assumed: true}

  # --- Cloud Landingzone ---------------------------------------------------
  - {proposition: cloud-landingzone, division: CD,  expertise: Cloud Engineering,
     role: build,   what: "Builds and maintains the landing zone"}
  - {proposition: cloud-landingzone, division: CD,  expertise: Platform Engineering,
     role: use,     what: "The platform runs inside it", assumed: true}
  - {proposition: cloud-landingzone, division: DAE, expertise: Data Platform,
     role: use,     what: "Data platform lands in it", assumed: true}
  - {proposition: cloud-landingzone, division: STT, expertise: Security,
     role: govern,  what: "Security baseline, policies and controls", assumed: true}

# The supply chain along the bottom of the page: who hands what to whom.
# Keep it to four or five steps — it is a reading aid, not a process model.
chain:
  - {division: CD,  label: "Cloud platform & landing zone"}
  - {division: DAE, label: "Agents, guardrails, MCP, flows"}
  - {division: CD,  label: "Software engineering builds & maintains apps"}
  - {division: STT, label: "Adoption, transformation & security"}
